openapi: 3.1.0
info:
  title: Codex Harness Control Plane API
  version: 0.17.0
paths:
  /health:
    get:
      description: Unauthenticated liveness probe; origin allowlist applies when an Origin header is supplied.
      responses:
        '200':
          description: Control Plane process is alive
  /ready:
    get:
      description: Unauthenticated readiness probe; origin allowlist applies when an Origin header is supplied. PostgreSQL mode requires connectivity and all migrations to be applied.
      responses:
        '200':
          description: Runtime is ready to receive traffic
        '503':
          description: Runtime dependency or migration readiness failed
  /tasks:
    get:
      responses:
        '200':
          description: Task list
  /forum/articles:
    get:
      description: Published Sora article discovery; Control Plane auth and origin policy apply.
      parameters:
        - in: query
          name: category
          required: false
          schema:
            type: string
            enum: [all, technology, design, life, photo, developer]
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Article summaries and category metadata
        '400':
          description: Invalid category or query
  /forum/articles/{slug}:
    get:
      description: Read one published Sora article by slug; Control Plane auth and origin policy apply.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      responses:
        '200':
          description: Full article detail
        '400':
          description: Invalid article slug
        '404':
          description: Article not found
  /tasks/{taskId}:
    get:
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Task detail
  /tasks/{taskId}/dag:
    get:
      responses:
        '200':
          description: Compiled DAG and current state
  /tasks/{taskId}/approvals:
    get:
      responses:
        '200':
          description: Approval state
  /tasks/{taskId}/approvals/{decision}:
    post:
      parameters:
        - in: path
          name: decision
          required: true
          schema:
            type: string
            enum: [approved, rejected]
      responses:
        '200':
          description: Approval updated
  /tasks/{taskId}/run:
    post:
      responses:
        '202':
          description: Run requested
  /tasks/{taskId}/feedback:
    get:
      responses:
        '200':
          description: Feedback events
  /tasks/{taskId}/observability:
    get:
      responses:
        '200':
          description: Metrics and audit summary
  /evaluation/summary:
    get:
      responses:
        '200':
          description: Evaluation summary
