<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Harness Control Plane</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,sans-serif;margin:2rem;line-height:1.5}
    table{border-collapse:collapse;width:100%}
    td,th{border:1px solid #ccc;padding:.5rem;text-align:left}
    code{background:#eee;padding:.1rem .3rem}
  </style>
</head>
<body>
  <h1>Harness Control Plane</h1>
  <p id="summary">Loading…</p>
  <table>
    <thead><tr><th>Task</th><th>State</th><th>Priority</th><th>Approval</th></tr></thead>
    <tbody id="tasks"></tbody>
  </table>
  <script>
    fetch('./data.json')
      .then(r=>r.json())
      .then(data=>{
        const o=data.overview||{};
        document.querySelector('#summary').textContent =
          `Tasks: ${o.taskCounts?.total||0} | Running: ${o.taskCounts?.running||0} | Blocked: ${o.taskCounts?.blocked||0} | Pending approvals: ${o.pendingApprovals||0} | Benchmark pass rate: ${o.benchmarkPassRate||0}%`;
        const tbody=document.querySelector('#tasks');
        for(const x of data.tasks||[]){
          const tr=document.createElement('tr');
          tr.innerHTML=`<td>${x.task?.id||''}</td><td>${x.task?.state||''}</td><td>${x.task?.priority||''}</td><td>${x.approval?.decision||'-'}</td>`;
          tbody.appendChild(tr);
        }
      });
  </script>
</body>
</html>
