name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare GitNexus native dependencies
        run: pnpm graph:prepare

      - name: Analyze GitNexus graph
        run: pnpm graph:analyze

      - name: Verify GitNexus provider health
        run: pnpm graph:doctor

      - name: Install Playwright browser dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright browser (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium

      - name: Run harness verification
        run: pnpm harness:verify

      - name: Upload validation artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            .codex/orchestration/runs/
            .codex/orchestration/requests/
            .codex/orchestration/shared/
            .codex/observability/tasks/
            .codex/evaluation/results/
            .gitnexus/
            coverage/
            dist/
            playwright-report/
            test-results/

  postgres:
    name: PostgreSQL production contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d harness"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HARNESS_DATABASE_URL: postgres://harness:harness@127.0.0.1:5432/harness
      HARNESS_RUNTIME_STORE: postgres
      HARNESS_REQUIRE_POSTGRES: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PostgreSQL production contract tests
        run: pnpm test:postgres

  deployment:
    name: Ubuntu deployment contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Ubuntu deployment contract
        run: pnpm deployment:validate
