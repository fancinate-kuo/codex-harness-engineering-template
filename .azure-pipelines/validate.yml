trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'

  - script: corepack enable
    displayName: Enable Corepack

  - script: pnpm install
    displayName: Install dependencies

  - script: pnpm harness:verify
    displayName: Harness verification
